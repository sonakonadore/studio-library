[package]
name = "studio-library"
version = "0.1.0"
edition = "2024"
description = "Offline studio project and sample library for macOS"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow"] }
libc = "0.2"
regex = "1.12"
rfd = { version = "0.15", default-features = false }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-wav", "symphonia-aiff", "symphonia-mp3"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.5", default-features = false, features = ["aiff", "mp3", "pcm", "wav"] }
tempfile = "3.23"
unicode-normalization = "0.1"
walkdir = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColorSpace", "NSResponder", "NSView", "NSWindow"] }
raw-window-handle = "0.6"
